# Derived by `toyos_metal::image::derive` — not committed, not edited.
# A metal boot ends itself: the job list below, then `reboot`.
[boot]
start = ["logkeeper", "diskserver", "fileserver", "soundserver", "acpiserver", "test-runner"]

[programs.acpiserver]
devices = ["acpi"]
receives = ["power"]
service = true

[programs.diskserver]
restart = true
serves = ["block", "disk"]
service = true

[programs.fileserver]
receives = ["block"]
restart = true
roles = ["data", "log", "boot"]

[programs.hda]
drives = ["pci:04:03:*"]
receives = ["sound-output"]
syscap = ["rt"]

[programs.logkeeper]
serves = ["log", "log-carrier"]
service = true
syscap = ["logread"]

[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

[programs.soundserver]
devices = ["pci:04:01:00/1af4:1059"]
serves = ["soundserver", "volume", "sound-output"]
service = true
syscap = ["rt"]

[programs.test-runner]
