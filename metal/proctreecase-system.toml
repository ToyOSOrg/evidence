# Derived by `toyos_metal::image::derive` — not committed, not edited.
# A metal boot ends itself: the job list below, then `reboot`.
[apps]
folder = "read-write"

[boot]
start = ["acpiserver", "logkeeper", "uart", "diskserver", "fileserver", "test-runner"]

[programs.acpiserver]
devices = ["acpi"]
receives = ["power"]
service = true

[programs.diskserver]
restart = true
serves = ["block", "disk"]
service = true

[programs.fileserver]
pager = true
receives = ["block"]
restart = true
roles = ["data", "log", "boot", "memory"]

[programs.grants]
receives = ["grants"]

[programs.logkeeper]
holds = ["log-origins"]
serves = ["log-carrier", "log-wire"]
service = true
syscap = ["logread", "console"]

[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

[programs.session]

[programs.shell]
starts = ["toybox", "shell", "grants"]

[programs.test-runner]
args = ["--bound-ms=60000", "test_rs_process_tree", "test_rs_launch_toctou", "test_rs_port_badge", "test_rs_app_view", "reboot"]
installs = true
login = true
receives = ["power"]
starts = ["toybox", "shell", "grants", "/apps"]
syscap = ["dup", "roster"]

[programs.toybox]
syscap = ["roster"]

[programs.uart]
devices = ["uart"]
holds = ["console-input"]
receives = ["log-wire"]
restart = true

[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

[programs.virtio-console]
drives = ["pci:07:80:00/1af4:1043"]
receives = ["log-carrier"]

[symlinks]
"bin/cat" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"
