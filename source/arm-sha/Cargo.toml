[package]
name = "arm-sha"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
toyos-crypto = { path = "lib/crypto" }

[workspace]

# toyos-crypto in [profile.toyos]'s settings, incremental or not.
[profile.shipped-inc]
inherits = "release"
incremental = true

[profile.shipped-inc.package.toyos-crypto]
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
codegen-units = 256

[profile.shipped-noninc]
inherits = "shipped-inc"
incremental = false
