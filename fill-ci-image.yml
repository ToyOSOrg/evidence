name: fill-ci-image

# Temporary: fills ghcr.io/toyosorg/debian once and measures both pulls.
on:
  push:
    branches: [wt/toyos-ci-image]

permissions:
  contents: read

jobs:
  fill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eux
          skopeo --version
          echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          src=sha256:a2aa46262453eba3f464d8b1c7a8c31db85eb15af180ae34dd400615d7208547
          skopeo copy --all --preserve-digests --retry-times 3 \
            docker://public.ecr.aws/docker/library/debian@$src docker://ghcr.io/toyosorg/debian:sid-20260918 \
          || skopeo copy --all --preserve-digests --retry-times 3 \
            docker://docker.io/library/debian@$src docker://ghcr.io/toyosorg/debian:sid-20260918
          skopeo inspect --raw docker://ghcr.io/toyosorg/debian:sid-20260918 | sha256sum
          skopeo inspect --raw docker://ghcr.io/toyosorg/debian@$src | sha256sum

  toolchain:
    needs: fill
    uses: ./.github/workflows/toolchain.yml

  guest:
    needs: toolchain
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/guest.yml
    with:
      kvm: true
      sysroot-key: ${{ needs.toolchain.outputs.sysroot-key }}
      sysroot-path: ${{ needs.toolchain.outputs.sysroot-path }}

  portability-linux-deps:
    needs: fill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/toyosorg/debian@sha256:a2aa46262453eba3f464d8b1c7a8c31db85eb15af180ae34dd400615d7208547
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: deps
        run: |
          for attempt in 1 2 3; do
            apt-get update -qq > /tmp/apt.log 2>&1 \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates \
                   build-essential qemu-system-x86 python3 cmake >> /tmp/apt.log 2>&1 \
              && break
            [ "$attempt" = 3 ] && { cat /tmp/apt.log; exit 1; }
            sleep 20
          done
          cat /tmp/apt.log
