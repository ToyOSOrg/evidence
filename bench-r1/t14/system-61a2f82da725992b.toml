# Derived by `toyos_metal::image::derive` — not committed, not edited.
# A metal boot ends itself: the job list below, then `reboot`.
assets = ["assets"]

[boot]
start = ["logkeeper", "diskserver", "fileserver", "compositor", "soundserver", "netstack", "sshserver", "test-runner", "ps2server"]

[programs.compositor]
devices = ["framebuffer", "keyboard", "mouse"]
receives = ["soundserver"]
serves = ["compositor", "prompt", "clipboard", "input", "display"]
service = true

[programs.diskserver]
devices = ["pci:01:08:02/1b36:0010"]
restart = true
serves = ["block"]
service = true

[programs.fileserver]
receives = ["block"]
restart = true
roles = ["data", "log", "boot"]

[programs.logkeeper]
serves = ["log"]
service = true
syscap = ["logread"]

[programs.netstack]
devices = ["pci:02:00:00/1af4:1041"]
serves = ["netstack"]
service = true

[programs.ps2server]
devices = ["isa:0060,0064:1,12"]
receives = ["input"]
restart = true

[programs.soundserver]
devices = ["hda-audio", "pci:04:01:00/1af4:1059"]
serves = ["soundserver", "volume"]
service = true
syscap = ["rt"]

[programs.sshserver]
receives = ["netstack"]
service = true

[programs.test-runner]
args = ["--bound-ms=60000", "test_rs_scale_window", "test_rs_ps2server_hold", "reboot"]
receives = ["compositor", "soundserver", "netstack", "log", "power"]
syscap = ["logread"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"
