# Derived by `toyos_metal::image::derive` — not committed, not edited.
# A metal boot ends itself: the job list below, then `reboot`.
[boot]
start = ["logkeeper", "diskserver", "fileserver", "soundserver", "acpiserver", "test-runner"]

[programs.acpiserver]
devices = ["acpi"]
receives = ["power"]
service = true

[programs.diskserver]
restart = true
serves = ["block", "disk"]
service = true

[programs.fileserver]
receives = ["block"]
restart = true
roles = ["data", "log", "boot"]

[programs.hda]
drives = ["pci:04:03:*"]
receives = ["sound-output"]
syscap = ["rt"]

[programs.logkeeper]
serves = ["log"]
service = true
syscap = ["logread"]

[programs.nvme]
drives = ["pci:01:08:02/1b36:0010"]
receives = ["disk"]

[programs.soundserver]
devices = ["pci:04:01:00/1af4:1059"]
serves = ["soundserver", "volume", "sound-output"]
service = true
syscap = ["rt"]

[programs.test-runner]
args = ["--bound-ms=64200", "test_rs_abuse_elf_loader", "test_rs_abuse_elf_segments", "test_rs_abuse_handle_table", "test_rs_abuse_page_straddle", "test_rs_abuse_pipe_owner", "test_rs_abuse_spawn_argv", "test_rs_an_export_shares_its_descriptions", "test_rs_counters_read", "test_rs_endowment_denied", "test_rs_futex_wake_counts", "test_rs_spawn_image_object", "test_rs_std_fs", "test_rs_std_fs_write", "test_rs_stream_handles", "reboot"]
receives = ["soundserver", "volume", "power", "log"]
syscap = ["device", "dup", "logread", "power", "roster", "counters", "trace", "inventory"]

[programs.toybox]
receives = ["soundserver"]

[programs.usbd]

[symlinks]
"bin/cat" = "/system/bin/toybox"
"bin/cp" = "/system/bin/toybox"
"bin/echo" = "/system/bin/toybox"
"bin/free" = "/system/bin/toybox"
"bin/grep" = "/system/bin/toybox"
"bin/hexdump" = "/system/bin/toybox"
"bin/ls" = "/system/bin/toybox"
"bin/mkdir" = "/system/bin/toybox"
"bin/mv" = "/system/bin/toybox"
"bin/ps" = "/system/bin/toybox"
"bin/pwd" = "/system/bin/toybox"
"bin/reboot" = "/system/bin/toybox"
"bin/rm" = "/system/bin/toybox"
"bin/shutdown" = "/system/bin/toybox"
"bin/tone" = "/system/bin/toybox"
