[package]
name = "toyos-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Bounded cryptographic primitives for ToyOS, with caller-owned entropy and portable host tests."
readme = "README.md"
exclude = ["evidence/**", "benchmarks/**", "claude-comms/**"]

[features]
default = []
std = ["rustls?/std"]
sign = []
wpa2 = []
portable = []
rustls-provider = ["dep:rustls"]

[dependencies]
rustls = { version = "=0.23.45", optional = true, default-features = false, features = ["custom-provider", "tls12"] }

[dev-dependencies]
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"
chacha20poly1305 = "=0.10.1"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
ed25519-dalek = "=2.2.0"
p256 = { version = "=0.13.2", features = ["ecdh"] }
p384 = { version = "=0.13.1", features = ["ecdh"] }
rsa = { version = "=0.9.8", features = ["sha2"] }
ml-kem = { version = "=0.2.1", features = ["deterministic"] }
chacha20 = "=0.9.1"
poly1305 = "=0.8.0"
kem = "=0.3.0-pre.0"
serde_json = "=1.0.149"

[[example]]
name = "negative_controls"
required-features = ["std"]

[[example]]
name = "timing"
required-features = ["std", "sign", "wpa2"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

