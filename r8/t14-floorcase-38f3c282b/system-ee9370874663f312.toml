# Derived by `toyos_metal::image::derive` — not committed, not edited.
# A metal boot ends itself: the job list below, then `reboot`.
[boot]
start = ["logkeeper", "acpiserver", "diskserver", "fileserver", "ps2server", "inputsink", "starveling", "test-runner"]

[programs.acpiserver]
devices = ["acpi"]
receives = ["power"]
service = true

[programs.diskserver]
restart = true
serves = ["block", "disk"]
service = true

[programs.fileserver]
receives = ["block"]
restart = true
roles = ["data", "log", "boot"]

[programs.inputsink]
serves = ["input", "keys"]
service = true

[programs.logkeeper]
memory-floor-mib = 32
serves = ["log"]
service = true
syscap = ["logread"]

[programs.nvme]
drives = ["pci:01:08:02"]
receives = ["disk"]

[programs.ps2server]
devices = ["isa:0060,0064:1,12"]
memory-floor-mib = 24
receives = ["input"]
restart = true

[programs.starveling]
restart = true
serves = ["starved"]
service = true

[programs.test-runner]
args = ["--bound-ms=60000", "test_rs_memory_floor", "reboot"]
memory-floor-mib = 64
receives = ["power", "keys", "starved", "log"]
syscap = ["device", "dup", "power", "jobs"]

[programs.toybox]

[programs.usbd]
drives = ["pci:0c:03:30/1033:0194", "pci:0c:03:30@boot"]
receives = ["disk"]

[supervisor]
memory-floor-mib = 64

[symlinks]
"bin/reboot" = "/system/bin/toybox"
