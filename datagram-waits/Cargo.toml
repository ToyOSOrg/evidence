[package]
name = "netring-datagram-waits"
version = "0.0.0"
edition = "2021"
publish = false
description = "Measurement only, never lands: a datagram socket's two waits over a netring region under loom, a call asleep when netstack raises the socket's pending error, and a sender asleep on a full send ring while netstack's queue is full."

[workspace]

[features]
want-relaxed = ["toyos-transport/want-relaxed"]

[dependencies]
toyos-transport = { path = "src/lib/blockring/transport" }
loom = "0.7"
