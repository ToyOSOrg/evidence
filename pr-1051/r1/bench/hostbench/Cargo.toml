[package]
name = "hostbench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
toyos-crypto = { path = "~/Dev/jan/toyos-mlkem/lib/crypto" }

[workspace]

[profile.shipped]
inherits = "dev"
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
incremental = true

[profile.unasserted]
inherits = "shipped"
debug-assertions = false
overflow-checks = false
