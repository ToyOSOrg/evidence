# Derived by `toyos_metal::image::derive` — not committed, not edited.
# A metal boot ends itself: the job list below, then `reboot`.
assets = ["assets"]

[boot]
start = ["logkeeper", "diskserver", "fileserver", "compositor", "soundserver", "netstack", "sshserver", "test-runner"]

[programs.compositor]
devices = ["framebuffer", "keyboard", "mouse"]
receives = ["soundserver"]
serves = ["compositor", "prompt", "clipboard"]
service = true

[programs.diskserver]
devices = ["pci:1b36:0010"]
restart = true
serves = ["block"]
service = true

[programs.fileserver]
receives = ["block"]
restart = true
roles = ["data", "log", "boot"]

[programs.logkeeper]
service = true
syscap = ["logread"]

[programs.netstack]
devices = ["pci:1af4:1041"]
serves = ["netstack"]
service = true

[programs.soundserver]
devices = ["hda-audio", "pci:1af4:1059"]
serves = ["soundserver"]
service = true
syscap = ["rt"]

[programs.sshserver]
receives = ["netstack"]
service = true

[programs.test-runner]
args = ["--bound-ms=60000", "reboot"]
receives = ["compositor", "soundserver", "netstack", "power"]
syscap = ["logread"]

[programs.toybox]

[symlinks]
"bin/reboot" = "/system/bin/toybox"
